name: Build and deploy backend

on:
  push:
    branches: [main]

env:
  IMAGE: verttistenberg/week4cloudservices-backend
  RAHTI_PROJECT: cloudservices26

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: latest

      - name: Log in to Rahti
        env:
          OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
          OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
        run: oc login --server="$OPENSHIFT_SERVER" --token="$OPENSHIFT_TOKEN"

      - name: Deploy
        run: |
          oc project "$RAHTI_PROJECT"
          oc set image deployment/backend backend=${{ env.IMAGE }}:${{ github.sha }}
          oc rollout status deployment/backend --timeout=180s
